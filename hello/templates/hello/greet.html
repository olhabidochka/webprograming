<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fancy Hello</title>
</head>
<body>
    <h2 style="color: green; font-size: 28px; text-align: center;">Greetings, visitor!</h2>
    
    <p style="font-size: 18px; text-align: center;">
        Hello, {{ name }}!
        {% if show_time %}
            It's {{ time }} now.
        {% endif %}
    </p>
</body>
</html>
